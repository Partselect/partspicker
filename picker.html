  --surface:#192328; --sunk:#141C20; --ink:#E6ECEE; --muted:#97A5AC; --line:#2A363C;
  --bar:#0B1013; --bar-ink:#E6ECEE; --bar-muted:#8394A0; --bar-line:#223038;
  --accent:#3AA6DB; --accent-ink:#04131C; --accent-soft:rgba(58,166,219,.16); --ring:rgba(58,166,219,.95);
  --ok:#5CC28A; --paper:#F5F5F1; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

.app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);transition:grid-template-columns .22s ease}
.app.mini{grid-template-columns:272px minmax(0,1fr) 88px}

/* ---------- top bar ---------- */
.top{position:relative;grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--bar);color:var(--bar-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;width:248px}
.brand{color:inherit;text-decoration:none;border-radius:10px}
.brand .back{color:var(--bar-muted)}
.brand:hover .back{color:var(--accent)}
.mark{width:38px;height:38px;border-radius:9px;border:1.5px solid rgba(0,101,151,.5);background:rgba(0,101,151,.08);color:var(--accent);display:grid;place-items:center}
.mark svg{width:30px;height:30px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:500 10.5px var(--f-mono);color:var(--bar-muted);letter-spacing:.06em}
.fignav{flex:1;display:flex;align-items:center;gap:6px;min-width:0;justify-content:center}
.navbtn{height:40px;min-width:40px;border-radius:8px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 10px}
.navbtn:hover{background:rgba(255,255,255,.06)}
.figbtn{flex:0 1 520px;min-width:0;justify-content:flex-start}
.figbtn .fn{font:700 12px var(--f-mono);color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.figbtn .ft{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.figbtn .of{margin-left:auto;font:500 11px var(--f-mono);color:var(--bar-muted);white-space:nowrap}
.iconbtn{width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--bar-line);background:transparent;color:var(--bar-ink);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.search{position:absolute;inset:0;display:flex;align-items:center;gap:10px;background:var(--bar);z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.search[hidden]{display:none!important}
.search svg{color:var(--bar-muted)}
.search input{flex:1;min-width:0;max-width:640px;height:44px;border:1.5px solid var(--accent);border-radius:10px;background:var(--sunk);color:var(--ink);padding:0 14px;font:500 16px var(--f-mono);box-sizing:border-box}
.results{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(100% + 6px);width:min(560px,calc(100vw - 32px));max-height:62vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:30}
.results button{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.results button:hover{background:var(--sunk)}
.results .pn{font:600 14px var(--f-mono)}
.results .meta{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* ---------- figure index ---------- */
.figs{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.figs .fhead{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.figs .fhead .lbl{font:600 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.figs input{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:0 10px;font:14px var(--f-ui)}
.flist{overflow:auto;flex:1;padding:6px}
.fitem{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;cursor:pointer}
.fitem:hover{background:var(--sunk)}
.fitem .no{font:600 12px var(--f-mono);color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 0}
.fitem .nm{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .ct{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-mono);display:grid;place-items:center;padding:0 6px}
.fitem.cur{background:var(--accent-soft)}
.fitem.cur .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fitem.cur .nm{font-weight:600}
.figs .closefig{display:none}

/* ---------- drawing ---------- */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;
  background-color:var(--mat);background-image:var(--gears);background-size:300px 300px}
.viewer{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;cursor:grab;overscroll-behavior:contain;padding-block:18px 28px;padding-inline:24px}
.viewer.dragging{cursor:grabbing}
.fighead{scroll-margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 12px}
.fighead .tag{font:700 12px var(--f-mono);color:var(--accent-ink);background:var(--accent);padding:4px 8px;border-radius:6px;letter-spacing:.06em}
.fighead h1,.fighead h2{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
.fighead .hint{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.fighead .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ring);background:var(--accent-soft)}
.figblock{margin-bottom:34px}
.figblock:last-child{margin-bottom:8px}
.fighead{width:var(--bw,100%)}
.ftable{width:var(--bw,100%)}
.sheet{width:var(--sw,100%);position:relative;margin:0 auto;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);container-type:inline-size;user-select:none;-webkit-user-select:none}
.sheet img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;border-radius:6px}
.hot{position:absolute;transform:translate(-50%,-50%);width:calc(var(--d)*1cqw);aspect-ratio:1;border-radius:50%;
  border:max(1.5px,calc(var(--d)*.07cqw)) solid var(--ring);background:var(--accent-soft);padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font:700 calc(var(--d)*.5cqw)/1 var(--f-ui);color:transparent;transition:transform .12s, background .12s}
.hot:hover{transform:translate(-50%,-50%) scale(1.18);background:rgba(0,101,151,.28)}
.hot.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hot.zero{background:var(--paper);color:var(--accent);border-style:dashed}
.hot .q{position:absolute;right:-30%;top:-30%;min-width:48%;height:48%;padding:0 6%;border-radius:999px;background:#162026;color:#fff;font:700 calc(var(--d)*.3cqw)/1 var(--f-mono);display:flex;align-items:center;justify-content:center}
.hot.pulse{animation:pulse .45s ease-out}
.hot.found{animation:found 1s ease-out 4;background:var(--accent);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 calc(var(--d)*.6cqw) rgba(0,101,151,0)}}
@keyframes found{0%{box-shadow:0 0 0 0 var(--ring)}100%{box-shadow:0 0 0 calc(var(--d)*1.4cqw) rgba(0,101,151,0)}}
.tools{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.tools button{width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.tools button+button{border-top:1px solid var(--line)}
.tools button:hover{background:var(--sunk)}
.tools .zl{font:600 10px var(--f-mono);color:var(--muted)}

.ftable{margin:18px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ftable summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
.ftable summary::-webkit-details-marker{display:none}
.ftable summary small{font-weight:400;color:var(--muted);margin-left:8px}
.ftable[open] summary .ch{transform:rotate(180deg)}
.ftable .wrap{overflow-x:auto}
.ftable table{width:100%;border-collapse:collapse;font-size:13px}
.ftable th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 10px;border-top:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.ftable td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
.ftable td.pn{font-family:var(--f-mono);white-space:nowrap}
.ftable td.r{font-family:var(--f-mono);color:var(--muted);text-align:right;width:2.5em}
.ftable td.u{font-family:var(--f-mono);text-align:center}
.ftable td.rem{color:var(--muted);font-size:12px}
.ftable .ul{display:none}
.tools{transition:opacity .18s}
.tools.off{opacity:0;pointer-events:none}
.ftable tr.in td{background:var(--accent-soft)}
.ftable tr.hit td{background:var(--accent);color:var(--accent-ink)}
.addbtn{height:30px;width:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- list panel ---------- */
.panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.phead .t{flex:1;min-width:0}
.phead h2{margin:0;font-size:18px;font-weight:700}
.phead .count{font:500 12px var(--f-mono);color:var(--muted)}
.mbadge{flex:none;box-sizing:border-box;align-self:center;font-size:14px!important;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;padding:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--f-mono)}
.mbadge.none{background:var(--sunk);color:var(--muted)}
.chev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
.phead .qdl{display:none}
.grab{display:none}
.plist{flex:1;overflow:auto;min-height:0}
.empty{padding:28px 22px;color:var(--muted);line-height:1.55}
.empty .steps{display:grid;gap:12px;margin-top:14px}
.empty .s{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;color:var(--ink)}
.empty .s i{font:700 12px var(--f-mono);font-style:normal;width:26px;height:26px;border-radius:50%;border:2px solid var(--ring);display:grid;place-items:center;color:var(--accent)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.item.flash{animation:flash .9s}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.item .pn{font:600 14.5px var(--f-mono);letter-spacing:.02em}
.item .nm{font-size:14px;overflow-wrap:anywhere}
.item .src{font:12px var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .src a{color:var(--accent);cursor:pointer;text-decoration:underline}
.item.z .pn,.item.z .nm{opacity:.45;text-decoration:line-through}
.item .zn{font:600 10.5px var(--f-ui);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.step{grid-row:1/span 3;grid-column:2;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.step button{width:40px;height:40px;border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.step button:hover{background:var(--accent-soft);color:var(--accent)}
.step output{min-width:42px;text-align:center;font:700 16px var(--f-mono);font-variant-numeric:tabular-nums;background:var(--surface);align-self:stretch;display:grid;place-items:center;border-inline:1px solid var(--line)}
.pfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.confirm{display:flex;gap:8px;align-items:center;width:100%;font-size:14px}
.confirm span{flex:1}

/* mini (collapsed) list on desktop: a slim rail */
.app.mini .plist,.app.mini .pfoot{display:none}
.app.mini .phead{flex-direction:column;justify-content:flex-start;padding:16px 6px;gap:10px;border:0;height:100%;text-align:center}
.app.mini .phead .t h2{font-size:13px}
.app.mini .phead .count{display:none}
.app.mini .chev{transform:rotate(180deg)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(8,12,14,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.dlg h3{margin:0;padding:16px 18px 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg .sub{padding:0 18px 12px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.dlg .body{overflow:auto}
.x{width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px}
.x:hover{background:var(--sunk)}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.var .pn{font:600 14.5px var(--f-mono)}
.var .d{font-size:13px;color:var(--muted)}
.var .btn{grid-row:1/span 2;grid-column:2;height:38px;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 18px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);cursor:pointer}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff}
.opt .ic.img{background:var(--accent)}
.opt .ic.xls{background:#1F7A4D}
.opt b{font-size:16px}
.opt span{font-size:13px;color:var(--muted);line-height:1.35}
.opt .txt{display:flex;flex-direction:column;gap:3px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px 20px}
.qgrid.odd .qtile:first-child{grid-column:1/-1}
.qtile{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border:1px solid var(--glass-line);border-radius:16px;background:var(--chip);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,background .15s,border-color .15s;color:var(--ink);min-width:0}
.qtile:hover{background:var(--accent-soft);border-color:var(--accent)}
.qtile:active{transform:scale(.97)}
.qtile .qn{flex:none;min-width:46px;height:46px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font:700 19px var(--f-mono);background:var(--glass-strong);border:1px solid var(--glass-line);color:var(--ink)}
.qtile.eng .qn{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px -8px var(--accent)}
.qtile .qt{display:flex;flex-direction:column;gap:1px;min-width:0}
.qtile .qt b{font-size:15px;white-space:nowrap}
.qtile .qt span{font:12px var(--f-mono);color:var(--muted)}
.qper{margin-top:6px;font:600 12px var(--f-mono);color:var(--ink);opacity:.8}
.qpn{font:700 16px var(--f-mono);color:var(--ink);margin-bottom:2px}
.qin{margin-top:6px;font:600 12px var(--f-mono);color:var(--accent)}
.qopts .opt{flex-direction:row;align-items:center;gap:14px}
.opt .qbig{flex:none;min-width:52px;height:52px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font:700 22px var(--f-mono);background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.opt .qbig.eng{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt small{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.dlg img{display:block;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:8px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px);animation:fade .15s}

/* ---------- tablet: figure index becomes a drop-down sheet ---------- */
@media (max-width:1150px){
  .app{grid-template-columns:minmax(0,1fr) 360px}
  .app.mini{grid-template-columns:minmax(0,1fr) 88px}
  .brand{width:auto}
  .figs{position:fixed;z-index:45;left:0;top:0;bottom:0;width:min(360px,88vw);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .app.navopen .figs{transform:none}
  .app.navopen::after{content:"";position:fixed;inset:0;background:rgba(8,12,14,.45);z-index:44}
  .figs .closefig{display:grid}
}
/* ---------- phone ---------- */
@media (max-width:760px){
  body{font-size:15px}
  .app,.app.mini{grid-template-columns:minmax(0,1fr)}
  .top{flex-wrap:wrap;gap:10px;padding-block:8px 10px}
  .brand{flex:1}
  .brand b{font-size:15px}
  .mark{width:32px;height:32px}
  .mark svg{width:25px;height:25px}
  .fignav{order:3;flex-basis:100%}
  .figbtn{flex:1}
  .figbtn .of{display:none}
  .viewer{padding:12px 12px 110px}
  .fighead{margin-bottom:10px}
  .fighead h1,.fighead h2{font-size:18px}
  .fighead .hint{margin-left:0;flex-basis:100%;font-size:12.5px}
  .panel{position:fixed;left:0;right:0;bottom:0;height:min(58%,540px);border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.2);z-index:40;transition:height .22s ease;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .grab{display:block!important;flex:none;padding:8px 0 2px;cursor:grab;touch-action:none}
  .grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
  .phead{touch-action:none}
  .panel.dragging{transition:none!important}
  .phead{padding:8px 16px 12px}
  .app.mini .panel{height:calc(76px + env(safe-area-inset-bottom,0px))}
  .app.mini .phead{flex-direction:row;justify-content:flex-start;align-items:center;height:auto;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px));text-align:left}
  .app.mini .phead .t h2{font-size:16px}
  .app.mini .phead .count{display:block}
  .app.mini .phead .qdl{display:inline-flex;height:40px;flex:none;padding:0 14px}
  .tools{right:12px;bottom:calc(min(58%,540px) + 12px)}
  .app.mini .tools{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .opts{grid-template-columns:1fr}
  .ftable thead{display:none}
  .ftable table,.ftable tbody{display:block}
  .ftable tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"r pn add" "r d add" "r m add";column-gap:10px;row-gap:2px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
  .ftable tr.in{background:var(--accent-soft)}
  .ftable tr.hit{background:var(--accent);color:var(--accent-ink)}
  .ftable tr.in td,.ftable tr.hit td{background:none}
  .ftable td{display:block;padding:0;border:0}
  .ftable td.r{grid-area:r;align-self:start;text-align:center;width:auto;font:600 12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 0;margin-top:1px}
  .ftable td.pn{grid-area:pn;font:600 14.5px var(--f-mono);letter-spacing:.02em}
  .ftable td.d{grid-area:d;font-size:14px;overflow-wrap:anywhere}
  .ftable td.u{grid-area:m;text-align:left;font:12px var(--f-mono);color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .ftable .ul{display:inline}
  .ftable td.rem{grid-area:m;justify-self:end;align-self:center;font:12px var(--f-mono);text-align:right;max-width:55%}
  .ftable td:last-child{grid-area:add}
  .ftable .addbtn{width:40px;height:40px;border-radius:10px;font-size:20px}
  .ftable tr.hit td.r,.ftable tr.hit td.u,.ftable tr.hit td.rem{color:inherit}
  .toast{top:calc(122px + env(safe-area-inset-top,0px))}
  .opt{flex-direction:row;align-items:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Glass theme ================= */
:root{
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.74); --glass-bar:rgba(20,30,36,.78);
  --glass-line:rgba(255,255,255,.75); --glass-edge:rgba(22,32,38,.10);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.25);
  --glass-shadow:0 1px 1px rgba(16,28,34,.05), 0 18px 40px -12px rgba(16,28,34,.22);
  --glass-blur:saturate(170%) blur(22px);
  --glow-a:rgba(0,120,190,.20); --glow-b:rgba(40,150,170,.14); --glow-c:rgba(88,119,142,.12);
  --scrim:rgba(14,20,24,.28);
  --chip:rgba(255,255,255,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass:rgba(28,40,47,.52); --glass-strong:rgba(26,37,44,.70); --glass-bar:rgba(10,16,19,.70);
  --glass-line:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.06);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.04);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3), 0 22px 48px -12px rgba(0,0,0,.6);
  --glow-a:rgba(58,166,219,.20); --glow-b:rgba(40,150,170,.12); --glow-c:rgba(88,119,142,.08);
  --scrim:rgba(4,8,10,.45); --chip:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{
  --glass:rgba(28,40,47,.52); --glass-strong:rgba(26,37,44,.70); --glass-bar:rgba(10,16,19,.70);
  --glass-line:rgba(255,255,255,.10); --glass-edge:rgba(255,255,255,.06);
  --glass-hl:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.04);
  --glass-shadow:0 1px 1px rgba(0,0,0,.3), 0 22px 48px -12px rgba(0,0,0,.6);
  --glow-a:rgba(58,166,219,.20); --glow-b:rgba(40,150,170,.12); --glow-c:rgba(88,119,142,.08);
  --scrim:rgba(4,8,10,.45); --chip:rgba(255,255,255,.06)}

/* ambient light behind the glass */
body{background:
  radial-gradient(60vmax 50vmax at 8% 0%,var(--glow-a),transparent 60%),
  radial-gradient(55vmax 45vmax at 100% 100%,var(--glow-b),transparent 60%),
  radial-gradient(40vmax 35vmax at 70% 30%,var(--glow-c),transparent 65%),
  var(--mat)}
.stage{background-color:transparent;background-image:var(--gears)}

/* shared glass surface */
.top,.figs,.panel,.tools,.ftable,.dlg,.toast,.results,.mbadge.none{
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

.top{background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 60%),var(--glass-bar);border-bottom:1px solid rgba(255,255,255,.06);box-shadow:0 8px 24px -16px rgba(0,0,0,.5);z-index:12}
.navbtn,.iconbtn{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.navbtn:hover,.iconbtn:hover{background:rgba(255,255,255,.11)}
.search{background:var(--glass-bar);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.search input{background:var(--glass-strong);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

.figs{background:var(--glass);border-right:1px solid var(--glass-edge);box-shadow:var(--glass-hl)}
.figs input,.figs .fhead{background:transparent}
.figs input{background:var(--chip);border-color:var(--glass-edge)}
.fitem:hover{background:var(--chip)}
.fitem.cur{background:linear-gradient(90deg,var(--accent-soft),transparent);box-shadow:inset 3px 0 0 var(--accent)}
.fitem .no{border-color:var(--glass-edge);background:var(--chip)}

.sheet{box-shadow:0 0 0 1px var(--glass-edge),var(--glass-shadow);border-radius:12px}
.sheet img{border-radius:12px}
.fighead .tag{box-shadow:0 4px 14px -4px var(--accent)}

.tools{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--glass-hl),var(--glass-shadow)}
.tools button+button{border-top-color:var(--glass-edge)}
.tools button:hover{background:var(--chip)}

.ftable{background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;box-shadow:var(--glass-hl),var(--glass-shadow)}
.ftable th{background:var(--chip);border-top-color:var(--glass-edge)}
.ftable td,.ftable tr{border-top-color:var(--glass-edge)}
.addbtn{background:var(--chip);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

.panel{background:var(--glass);border-left:1px solid var(--glass-edge);box-shadow:var(--glass-hl)}
.phead,.pfoot,.item{border-color:var(--glass-edge)}
.item.flash{animation:flashg .9s}
@keyframes flashg{from{background:var(--accent-soft)}to{background:transparent}}
.step{background:var(--chip);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.step output{background:var(--glass-strong);border-color:var(--glass-edge)}
.mbadge{box-shadow:0 6px 18px -6px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.mbadge.none{background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-edge)}
.btn{background:var(--chip);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--accent);border-color:transparent;box-shadow:0 10px 24px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.primary:disabled{box-shadow:none}

/* popups */
.modal{background:var(--scrim);-webkit-backdrop-filter:blur(10px) saturate(120%);backdrop-filter:blur(10px) saturate(120%)}
.dlg{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:22px;box-shadow:var(--glass-hl),var(--glass-shadow);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(10px) scale(.97);opacity:0}}
.dlg h3{padding:18px 20px 6px}
.dlg .sub{padding:0 20px 14px;border-color:var(--glass-edge)}
.x{background:var(--chip);border-radius:50%;box-shadow:inset 0 0 0 1px var(--glass-edge)}
.opts{padding:16px 20px 20px}

.opt:hover{background:var(--accent-soft);border-color:var(--accent)}
.opt:active{transform:scale(.98)}
.opt .qbig{background:var(--glass-strong);border-color:var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.opt .qbig.eng,.opt .ic{box-shadow:0 8px 20px -8px var(--accent),inset 0 1px 0 rgba(255,255,255,.35)}
.opt .ic.xls{box-shadow:0 8px 20px -8px #1F7A4D,inset 0 1px 0 rgba(255,255,255,.35)}

.results button{border-color:var(--glass-edge)}
.results button:hover{background:var(--chip)}

@media (max-width:760px){
  .panel{background:var(--glass-strong);border-top:1px solid var(--glass-line);border-radius:24px 24px 0 0;box-shadow:var(--glass-hl),0 -18px 40px -14px rgba(0,0,0,.35)}

}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){

<div id="pp-load" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(70vmax 55vmax at 50% 0%,rgba(0,101,151,.16),transparent 60%),#F7FAFC;color:#132232;font:15px 'IBM Plex Sans Condensed',Arial,sans-serif">
  <img src="marinics.png" alt="Marinics" style="width:150px;height:auto">
  <div id="pp-spin" style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,101,151,.18);border-top-color:#006597;animation:ppspin .8s linear infinite"></div>
  <div id="pp-load-msg" style="max-width:320px;line-height:1.5;color:#486B7D">Loading drawings…</div>
  <a id="pp-load-act" href="index.html" hidden style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:12px;background:#006597;color:#fff;font-weight:600;text-decoration:none">Go to sign in</a>
  <style>@keyframes ppspin{to{transform:rotate(360deg)}}</style>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="pp-auth.js"></script>
<script>
(async () => {
  const L = document.getElementById('pp-load'), M = document.getElementById('pp-load-msg'), A = document.getElementById('pp-load-act'), S = document.getElementById('pp-spin');
  const stop = (text, label, href) => { S.hidden = true; M.textContent = text; if (label) { A.textContent = label; A.href = href; A.hidden = false; } };
  try {
    if (!window.PP || !PP.configured) return stop('Sign-in isn’t connected yet. See the README to add your Firebase keys.', 'Back to home', 'index.html');
    const user = await PP.ready;
    if (!user) { location.replace('index.html'); return; }
    if (PP.session) PP.session.guard(user, d => location.replace('index.html?kicked=' + (d.device === 'signed-out' ? 'admin' : '1')));   // first device only
    try { const acc = await PP.db.collection('access').doc(user.email.toLowerCase()).get(); if (acc.exists && acc.data().mustChange === true) { location.replace('index.html'); return; } } catch (e) {}
    // Reuse the drawings saved on this phone unless the admin has uploaded a newer catalogue (saves the free download allowance).
    const id = new URLSearchParams(location.search).get('m') || 'f300det';
    const model = PP.db.collection('models').doc(id), figs = model.collection('figures').orderBy('n');
    let ver = null, snap = null, meta = null;
    try { const m = await model.get({ source: 'server' }); meta = m.exists ? m.data() : null; const u = meta && meta.updated; ver = u && u.toMillis ? String(u.toMillis()) : '0'; }
    catch (e) { if (e && e.code === 'permission-denied') throw e; try { const m = await model.get({ source: 'cache' }); meta = m.exists ? m.data() : null; } catch (e2) {} }
    window.__MODEL = { id, name: (meta && meta.name) || id.toUpperCase(), catalog: (meta && meta.catalog) || '', short: (meta && meta.short) || id.slice(0, 4).toUpperCase() };
    document.title = 'Parts Picker';
    let saved = null; try { saved = localStorage.getItem('pp-cat-ver-' + id); } catch (e) {}
    if (ver === null || ver === saved) { try { const c = await figs.get({ source: 'cache' }); if (!c.empty) snap = c; } catch (e) {} }
    if (!snap) { M.textContent = 'Downloading drawings… (first time only)'; snap = await figs.get(); if (ver !== null) try { localStorage.setItem('pp-cat-ver-' + id, ver); } catch (e) {} }
    if (snap.empty) return stop('The drawings haven’t been uploaded yet. An admin needs to upload the catalogue on the admin page.', 'Back to home', 'index.html');
    window.__FIGS = snap.docs.map(d => { const x = d.data(); return { n: x.n, t: x.t, w: x.w, h: x.h, hs: x.hs, img: x.img, hot: JSON.parse(x.hot), parts: JSON.parse(x.parts) }; });
    const s = document.createElement('script'); s.textContent = document.getElementById('pp-main').textContent; document.body.appendChild(s);
    L.style.transition = 'opacity .35s'; L.style.opacity = '0'; setTimeout(() => L.remove(), 380);
  } catch (err) {
    const denied = err && err.code === 'permission-denied';
    stop(denied ? 'Your subscription has ended, is paused, or doesn’t include this engine. Contact Marinics.' : 'Couldn’t load the drawings. Check your connection and try again.', denied ? 'Go to sign in' : 'Try again', denied ? 'index.html' : location.href);
  }
})();
</script>
<script type="text/plain" id="pp-main">
const FIGS = window.__FIGS;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODEL = Object.assign({ id: 'f300det', name: 'F300DET / FL300DET', catalog: '1Z6JD-200SA', short: 'F300' }, window.__MODEL || {});
const KEY = MODEL.id + '-parts-list-v1';
try { document.querySelector('.brand small').textContent = MODEL.name.replace(/\s*\/\s*/g, ' · '); } catch (e) {}
const ICON_DL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
let list = [];
try { const s = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(s)) list = s; } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
let cur = 0, zoom = 1;
try { const f = +localStorage.getItem(KEY + '-fig'); if (f >= 0 && f < FIGS.length) cur = f; } catch (e) {}
const app = $('#app'), viewer = $('#viewer'), sheetsEl = $('#sheets');
const isPhone = () => window.innerWidth <= 760;

// ---------- figure index ----------
function renderFigList(){
  const v = $('#ffilter').value.trim().toLowerCase();
  const counts = {}; list.forEach(x => { if (x.qty > 0) counts[x.fig] = (counts[x.fig] || 0) + 1; });
  $('#flist').innerHTML = FIGS.map((f, i) => (!v || f.t.toLowerCase().includes(v) || String(f.n) === v) ?
    `<button class="fitem ${i === cur ? 'cur' : ''}" data-i="${i}"><span class="no">${f.n}</span><span class="nm">${esc(f.t)}</span>${counts[f.n] ? `<span class="ct">${counts[f.n]}</span>` : '<span></span>'}</button>` : '').join('');
}
$('#ffilter').addEventListener('input', renderFigList);
$('#flist').addEventListener('click', e => { const b = e.target.closest('.fitem'); if (!b) return; showFig(+b.dataset.i); app.classList.remove('navopen'); });
$('#figbtn').onclick = () => { if (window.innerWidth <= 1150) { app.classList.add('navopen'); setTimeout(() => $('.fitem.cur')?.scrollIntoView({ block: 'center' }), 60); } else { $('#ffilter').focus(); } };
$('#closefig').onclick = () => app.classList.remove('navopen');
app.addEventListener('click', e => { if (app.classList.contains('navopen') && e.target === app) app.classList.remove('navopen'); });
document.addEventListener('pointerdown', e => { if (app.classList.contains('navopen') && !e.target.closest('.figs,#figbtn')) app.classList.remove('navopen'); });
$('#prev').onclick = () => showFig(Math.max(0, cur - 1));
$('#next').onclick = () => showFig(Math.min(FIGS.length - 1, cur + 1));

function partsFor(f, ref){ return f.parts.filter(p => p[0] === ref); }
function qtyOf(pn){ const it = list.find(x => x.pn === pn); return it ? it.qty : null; }

// All figures in one continuous scroll
const CHEV = '<svg class="ch" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const blocks = [], sheets = [];
function buildFigs(){
  sheetsEl.innerHTML = FIGS.map((f, i) => `<section class="figblock" data-fi="${i}" id="fig-${f.n}">
    <div class="fighead"><span class="tag">FIG. ${f.n}</span><h2>${esc(f.t)}</h2>${i === 0 ? '<span class="hint"><span class="dot"></span>Tap a circled number to add the part</span>' : `<span class="hint">${i + 1} / ${FIGS.length}</span>`}</div>
    <div class="sheet" data-fi="${i}" style="aspect-ratio:${f.w} / ${f.h}"><img src="${f.img}" width="${f.w}" height="${f.h}" alt="Fig. ${f.n} ${esc(f.t)} drawing" loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async"></div>
    <details class="ftable" data-fi="${i}"><summary><span>All parts in Fig. ${f.n}<small>${f.parts.length} items · tap + to add</small></span>${CHEV}</summary><div class="wrap"><table><thead><tr><th>Ref</th><th>Part no.</th><th>Description</th><th>Qty/unit</th><th>Remarks</th><th></th></tr></thead><tbody></tbody></table></div></details>
  </section>`).join('');
  sheetsEl.querySelectorAll('.figblock').forEach(b => blocks.push(b));
  sheetsEl.querySelectorAll('.sheet').forEach((sh, i) => {
    sheets.push(sh);
    const f = FIGS[i], d = Math.max(f.hs * 1.85, 2.2), frag = document.createDocumentFragment();
    for (const [t, x, y] of f.hot) {
      const b = document.createElement('button');
      b.className = 'hot'; b.style.left = x + '%'; b.style.top = y + '%';
      b.style.setProperty('--d', (t.length > 1 ? d * 1.08 : d).toFixed(3));
      b.dataset.ref = t; b.setAttribute('aria-label', 'Fig ' + f.n + ' ref ' + t); b.textContent = t;
      frag.appendChild(b);
    }
    sh.appendChild(frag);
  });
  sheetsEl.querySelectorAll('details.ftable').forEach(d => d.addEventListener('toggle', () => { if (d.open) drawTable(+d.dataset.fi); }));
  refreshHots();
}
function setCur(i){
  if (i === cur) return;
  cur = i;
  try { localStorage.setItem(KEY + '-fig', i); } catch (e) {}
  const f = FIGS[i];
  $('#bfn').textContent = 'FIG ' + f.n; $('#bft').textContent = f.t; $('#bof').textContent = `${i + 1} / ${FIGS.length}`;
  document.querySelectorAll('.fitem').forEach(b => b.classList.toggle('cur', +b.dataset.i === i));
}
function showFig(i){
  const b = blocks[i]; if (!b) return;
  progScroll();
  viewer.scrollTop += b.getBoundingClientRect().top - viewer.getBoundingClientRect().top - 6;
  viewer.scrollLeft = 0;
  setCur(i);
}
let curRaf = 0;
viewer.addEventListener('scroll', () => {
  if (curRaf) return;
  curRaf = requestAnimationFrame(() => {
    curRaf = 0;
    const line = viewer.getBoundingClientRect().top + viewer.clientHeight * 0.35;
    let lo = 0, hi = blocks.length - 1, ans = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (blocks[m].getBoundingClientRect().top <= line) { ans = m; lo = m + 1; } else hi = m - 1; }
    setCur(ans);
  });
}, { passive: true });
function styleHot(b){
  const f = FIGS[+b.parentElement.dataset.fi];
  const qs = partsFor(f, b.dataset.ref).map(p => qtyOf(p[1])).filter(q => q !== null);
  b.classList.toggle('on', qs.some(q => q > 0));
  b.classList.toggle('zero', qs.length > 0 && !qs.some(q => q > 0));
  b.querySelector('.q')?.remove();
  const tot = qs.reduce((a, q) => a + q, 0);
  if (tot > 0) { const s = document.createElement('span'); s.className = 'q'; s.textContent = tot; b.appendChild(s); }
}
function refreshHots(){ sheetsEl.querySelectorAll('.hot').forEach(styleHot); }
function drawTable(fi){
  const f = FIGS[fi], tb = blocks[fi].querySelector('tbody');
  tb.innerHTML = f.parts.map((p, k) => {
    const unit = p[3] === p[4] || !p[4] ? p[3] : `${p[3]} / ${p[4] || '–'}`;
    return `<tr class="${qtyOf(p[1]) !== null ? 'in' : ''}"><td class="r">${esc(p[0])}</td><td class="pn">${esc(p[1])}</td><td class="d">${esc(p[2].replace(/^\.+/, ''))}</td><td class="u"><span class="ul">Per engine </span>${esc(unit)}</td><td class="rem">${esc(p[5])}</td><td><button class="addbtn" data-k="${k}" aria-label="Add ${esc(p[1])}">+</button></td></tr>`;
  }).join('');
}
function refreshTables(){ sheetsEl.querySelectorAll('details.ftable[open]').forEach(d => drawTable(+d.dataset.fi)); }
sheetsEl.addEventListener('click', e => {
  const ab = e.target.closest('.addbtn');
  if (ab) { const fi = +ab.closest('.figblock').dataset.fi; pickQty(FIGS[fi].parts[+ab.dataset.k], FIGS[fi].n); }
});
function refreshAll(flashPn){ save(); renderList(flashPn); refreshHots(); refreshTables(); renderFigList(); }

// ---------- tapping numbers ----------
let moved = false;
sheetsEl.addEventListener('click', e => {
  const b = e.target.closest('.hot'); if (!b || moved) return;
  const f = FIGS[+b.parentElement.dataset.fi], ps = partsFor(f, b.dataset.ref);
  if (!ps.length) return;
  b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
  setMini(false);
  setTimeout(() => {
    const pr = $('#panel').getBoundingClientRect(), br = b.getBoundingClientRect();
    if (isPhone() && br.bottom > pr.top - 12) { progScroll(); viewer.scrollTop += br.bottom - pr.top + 60; }
  }, 260);
  if (ps.length === 1) pickQty(ps[0], f.n); else chooser(f, b.dataset.ref, ps);
});
function modal(html){ $('#layer').innerHTML = `<div class="modal" id="m">${html}</div>`; $('#m').onclick = e => { if (e.target.id === 'm' || e.target.closest('[data-close]')) closeModal(); }; }
function closeModal(){ $('#layer').innerHTML = ''; }
function chooser(f, ref, ps){
  modal(`<div class="dlg" role="dialog" aria-label="Choose part"><h3><span>Fig. ${f.n} · Ref ${esc(ref)}</span><button class="x" data-close aria-label="Close">✕</button></h3><div class="sub">${ps.length} part numbers share this reference. Pick the one you need.</div><div class="body">${
    ps.map((p, k) => `<div class="var"><div class="pn">${esc(p[1])}${qtyOf(p[1]) !== null ? ` <span style="color:var(--accent);font-size:12px">· in list (${qtyOf(p[1])})</span>` : ''}</div><button class="btn primary" data-k="${k}">Add</button><div class="d">${esc(p[2])}${p[5] ? ' · ' + esc(p[5]) : ''}</div></div>`).join('')}</div></div>`);
  document.querySelectorAll('.var .btn').forEach(btn => btn.onclick = () => { closeModal(); pickQty(ps[+btn.dataset.k], f.n); });
}

// ---------- list ----------
function add(p, fig, n = 1){
  let it = list.find(x => x.pn === p[1]);
  if (it) it.qty += n;
  else { it = { pn: p[1], desc: p[2].replace(/^\.+/, ''), fig, ref: p[0], rem: p[5] || '', qty: n }; list.push(it); }
  refreshAll(it.pn); setMini(false);
  toast(`Added ${n} × ${it.pn} · qty now ${it.qty}`);
}
// Ask: one piece, or the full quantity one engine uses (from the catalogue)
function pickQty(p, fig){
  const per = parseInt(p[3], 10) || parseInt(p[4], 10) || 1;
  const opts = [{ n: 1, t: 'Single piece', s: '1 pc', eng: false }];
  for (let k = 1; k <= 4; k++) {
    if (k === 1 && per === 1) continue;            // same as a single piece
    opts.push({ n: per * k, t: `${k} engine${k > 1 ? 's' : ''}`, s: `${per * k} pcs`, eng: true });
  }
  const inList = qtyOf(p[1]);
  modal(`<div class="dlg" role="dialog" aria-label="How many to add"><h3><span>How many to add?</span><button class="x" data-close aria-label="Close">✕</button></h3>
    <div class="sub"><div class="qpn">${esc(p[1])}</div>${esc(p[2].replace(/^\.+/, ''))} · Fig. ${fig} · Ref ${esc(p[0])}
      <div class="qper">${per} per engine</div>${inList !== null ? `<div class="qin">Already in list: ${inList}</div>` : ''}</div>
    <div class="qgrid ${opts.length % 2 ? 'odd' : ''}">

// ---------- zoom & pan ----------
function baseWidth(){

// The drawing (sheet) under a screen y, or the nearest one
function sheetAt(y){
  let best = null, bd = Infinity;

    const r = sh.getBoundingClientRect();
    const d = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    if (d < bd) { bd = d; best = sh; if (!d) break; }

}
// Zoom keeping the point under (cx, cy) (screen coordinates) fixed on screen.
function setZoom(z, cx, cy){

// Two-finger pinch: smooth GPU preview while the fingers move, then one exact re-layout when they lift.
let pinch = null;
const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });

viewer.addEventListener('touchstart', e => {
  if (e.touches.length !== 2) return;

  pinch = { d: dist(a, b), z: zoom, m0: m, m, s: 1, sh, fx: (m.x - r.left) / r.width, fy: (m.y - r.top) / r.height };

// ---------- search ----------
const INDEX = []; FIGS.forEach((f, i) => f.parts.forEach(p => INDEX.push({ i, f: f.n, p })));
const q = $('#q'), res = $('#results'), sform = $('#sform');
const norm = v => v.toLowerCase().replace(/[–—\s-]/g, '');
function findParts(v){
  const n = norm(v); if (n.length < 2) return [];
  const exact = INDEX.filter(x => norm(x.p[1]) === n);
  const starts = INDEX.filter(x => norm(x.p[1]).startsWith(n) && !exact.includes(x));
  const inPn = INDEX.filter(x => norm(x.p[1]).includes(n) && !exact.includes(x) && !starts.includes(x));
  const t = v.trim().toLowerCase();
  const inName = t.length >= 3 ? INDEX.filter(x => x.p[2].toLowerCase().includes(t) && !norm(x.p[1]).includes(n)) : [];

});

function goToPart(h, quiet){
