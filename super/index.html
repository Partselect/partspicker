<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parts Picker Super</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132232">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parts Picker Super">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: control room. Navy bar with tabs, stat tiles, then a working list. Fixed light theme. */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --sunk:#F5F8FA; --ink:#132232; --muted:#5B7486; --line:rgba(19,34,50,.10);
  --blue:#006597; --blue-soft:rgba(0,101,151,.10); --navy:#132232; --slate:#58778E;
  --ok:#1F7A4D; --ok-soft:rgba(31,122,77,.12); --warn:#B26A00; --warn-soft:rgba(178,106,0,.13); --bad:#C0392B; --bad-soft:rgba(192,57,43,.11); --off:#6B7C88; --off-soft:rgba(107,124,136,.14);
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(19,34,50,.06),0 14px 34px -18px rgba(19,34,50,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font:15px var(--f-ui);color:var(--ink);background:radial-gradient(70vmax 50vmax at 0% 0%,rgba(0,101,151,.12),transparent 60%),radial-gradient(60vmax 50vmax at 100% 100%,rgba(88,119,142,.16),transparent 60%),var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:rgba(19,34,50,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#EAF1F5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .lg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden}
.brand .lg img{width:40px}
.brand b{display:block;font-size:18px}
.brand small{display:block;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#93A9B8}
.me{font:500 12px var(--f-mono);color:#93A9B8}
.tbtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#EAF1F5;cursor:pointer;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{height:42px;padding:0 18px;border:0;background:none;color:#93A9B8;font-weight:700;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#3AA6DB}
main{max-width:1180px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:16px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:var(--shadow);cursor:pointer;text-align:left;border-left:4px solid var(--c)}
.stat .n{font:700 30px/1 var(--f-mono);color:var(--c)}
.stat .l{margin-top:6px;font-size:13px;color:var(--muted)}
.stat[aria-pressed="true"]{outline:2px solid var(--c)}
.panel{background:rgba(255,255,255,.86);border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow)}
.panel>.tools:first-child,.panel>.upload:first-child{border-radius:18px 18px 0 0}
#ulist{padding-bottom:4px}
#ulist tr:last-child .menu{top:auto;bottom:calc(100% + 6px)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
.tools input[type=search]{flex:1;min-width:180px;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--sunk)}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--slate)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 22px -12px var(--blue)}
.btn.sm{height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.u b{display:block}
.u small{font:12px var(--f-mono);color:var(--muted)}
.mono{font:13px var(--f-mono);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:600 12px var(--f-ui);background:var(--pc-soft);color:var(--pc);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-active{--pc:var(--ok);--pc-soft:var(--ok-soft)} .s-soon{--pc:var(--warn);--pc-soft:var(--warn-soft)} .s-expired{--pc:var(--bad);--pc-soft:var(--bad-soft)} .s-paused,.s-none{--pc:var(--off);--pc-soft:var(--off-soft)}
.days{display:block;font:12px var(--f-mono);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:600 11px var(--f-mono);padding:3px 7px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--muted)}
.renew{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid}
.menu button{height:38px;border:0;background:none;text-align:left;padding:0 10px;border-radius:8px;cursor:pointer;font-weight:600}
.menu button:hover{background:var(--blue-soft);color:var(--blue)}
/* catalogue cards */
.cats{display:grid;gap:12px;padding:14px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cat h3{margin:0;font-size:17px}
.cat .meta{font:12px var(--f-mono);color:var(--muted)}
.cat .r{grid-row:1/span 2;grid-column:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{appearance:none;width:44px;height:26px;border-radius:13px;background:#C9D4DB;position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--ok)} .switch input:checked::after{left:21px}
.upload{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
.file{flex:1;min-width:220px;display:block;padding:14px;border:1.5px dashed rgba(0,101,151,.35);border-radius:12px;text-align:center;cursor:pointer;color:var(--muted);background:rgba(0,101,151,.03)}
.file b{color:var(--blue)}
.prog{height:5px;background:var(--blue-soft)}.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
/* dialogs */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(19,34,50,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 70px -20px rgba(19,34,50,.5);animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.dlg h2{margin:0;padding:18px 20px 4px;font-size:20px}
.dlg .sub{padding:0 20px 12px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.dlg form{padding:16px 20px 20px;display:grid;gap:12px}
.f label{display:block;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.f input,.f select{width:100%;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}
.f input:focus,.f select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pw{display:flex;gap:8px}.pw input{flex:1;font-family:var(--f-mono)}
.eng{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);max-height:180px;overflow:auto}
.eng label{display:flex;gap:10px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;font-family:var(--f-ui);color:var(--ink);margin:0;cursor:pointer}
.eng input{width:18px;height:18px;accent-color:var(--blue)}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.msg{min-height:18px;font-size:14px;line-height:1.45}
.err{color:var(--bad)}.ok{color:var(--ok)}
.creds{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.7 var(--f-mono);white-space:pre-wrap;user-select:all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px}
/* sign-in */
.login{max-width:420px;margin:8vh auto 0;padding:26px;background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:22px;box-shadow:var(--shadow)}
.login img{display:block;width:140px;margin:0 auto 10px}
.login h1{margin:0;text-align:center;font-size:24px}
.login p{margin:4px 0 18px;text-align:center;color:var(--muted)}
.login form{display:grid;gap:12px}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{padding:12px 14px;border-bottom:1px solid var(--line)}
  td{border:0;padding:4px 0}
  td[data-l]::before{content:attr(data-l);display:inline-block;min-width:76px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .acts{justify-content:flex-start;margin-top:6px}
  .cat{grid-template-columns:1fr}.cat .r{grid-row:auto;grid-column:1;justify-content:flex-start}
  .two{grid-template-columns:1fr}
  .me{display:none}
}
.cnt{display:inline-block;font:700 13px var(--f-mono);padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue)}
.cnt.full{background:var(--warn-soft);color:var(--warn)}
.mails{display:grid;gap:1px;margin-top:4px;font:12px var(--f-mono);color:var(--muted)}
.mails .none{font-style:italic}
.logins{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.li .lt{flex:1;min-width:0;display:grid}
.li span{min-width:0;overflow:hidden;text-overflow:ellipsis;font:13px var(--f-mono)}
.li .dev{font-size:12px;color:var(--muted)}
.li{flex-wrap:wrap}
.logins .none{color:var(--muted);font-size:14px}
.addl{display:grid;gap:10px;padding:12px;border:1.5px dashed rgba(0,101,151,.3);border-radius:14px}
.full{padding:12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.warnbox{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:#7A2318;font-size:14px;line-height:1.45}
.warnbox b{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.rulesban{margin-bottom:16px;padding:14px 16px;border-radius:14px;background:var(--bad-soft);border:1px solid rgba(192,57,43,.3);color:#7A2318;line-height:1.5;font-size:14.5px}
.rulesban b{color:var(--bad)}.rulesban code{font:600 13px var(--f-mono)}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="in">
    <div class="bar">
      <div class="brand"><span class="lg"><img src="../marinics.png" alt=""></span><div><b>Parts Picker</b><small>Super admin</small></div></div>
      <span class="me" id="me"></span>
      <button class="tbtn" id="signout">Sign out</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="users">Companies</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="cats">Catalogues</button>
    </div>
  </div>
</header>

<main>
  <section class="login" id="login" hidden>
    <img src="../marinics.png" alt="Marinics">
    <h1>Super admin</h1>
    <p>Owner sign-in</p>
    <form id="lform">
      <div class="f"><label for="lem">Email</label><input id="lem" type="email" autocomplete="username" required></div>
      <div class="f"><label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" type="submit" style="justify-content:center;height:48px">Sign in</button>
      <div class="msg" id="lmsg"></div>
    </form>
  </section>

  <div class="rulesban" id="rulesban" hidden></div>
  <section id="v-users" hidden>
    <div class="stats" id="stats"></div>
    <div class="panel">
      <div class="tools">
        <input type="search" id="q" placeholder="Search company or email" aria-label="Search companies">
        <button class="btn pri" id="adduser"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add company</button>
      </div>
      <div id="ulist"></div>
    </div>
  </section>

  <section id="v-cats" hidden>
    <div class="panel">
      <div class="upload">
        <label class="file" for="cfile"><b>Choose catalogue file</b> · <span id="cfname">e.g. f300det-catalogue.json</span></label>
        <input id="cfile" type="file" accept=".json,application/json" hidden>
        <button class="btn pri" id="cgo" disabled>Upload catalogue</button>
      </div>
      <div class="prog"><i id="cprog"></i></div>
      <div class="msg" id="cmsg" style="padding:10px 14px 0"></div>
      <div class="cats" id="clist"></div>
    </div>
  </section>
</main>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script><script>window.PP_APP_NAME = "super";</script>
<script src="../pp-auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAY = 864e5, SOON = 14;
const toDate = t => t ? (t.toDate ? t.toDate() : new Date(t)) : null;
const fmtD = d => d ? d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
const isoD = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const addMonths = (d, m) => { const r = new Date(d); r.setMonth(r.getMonth() + m); return r; };
const TS = d => firebase.firestore.Timestamp.fromDate(d);
let me = null, users = [], models = [], filter = 'all', data = null;
const toast = t => { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => el.remove(), 2600); };

function status(u){
  const end = toDate(u.end);
  if (!end) return { k: 'none', label: 'No subscription' };
  if (u.active === false) return { k: 'paused', label: 'Paused' };
  const left = Math.ceil((end - Date.now()) / DAY);
  if (left <= 0) return { k: 'expired', label: 'Expired', left };
  if (left <= SOON) return { k: 'soon', label: 'Ending soon', left };
  return { k: 'active', label: 'Active', left };
}

// ---------- sign in ----------
function view(user){
  me = user;
  const ok = !!user;
  $('login').hidden = ok; $('top').hidden = !ok;
  if (!ok) { $('v-users').hidden = $('v-cats').hidden = true; return; }
  $('me').textContent = user.email;
  if (PP.adminEmail && user.email.toLowerCase() !== PP.adminEmail) { $('lmsg').textContent = ''; }
  showTab('users'); refresh(); checkRules();
}
// Make sure the rules published in Firebase give the super admin full control
async function checkRules(){
  const ban = $('rulesban');
  try {
    const r = PP.db.collection('_check').doc('owner');
    await r.set({ at: firebase.firestore.FieldValue.serverTimestamp(), by: me.email });
    await r.delete();
    ban.hidden = true;
  } catch (e) {
    ban.hidden = false;
    ban.innerHTML = `<b>Firebase is blocking the super admin (${esc(e.code || e.message)}).</b> The Firestore rules published in Firebase are old. Open Firebase → Firestore Database → Rules, delete everything, paste the latest <code>firestore.rules</code>, Publish, wait a minute, then reload this page.`;
  }
}
if (!PP.configured) { $('login').hidden = false; $('lmsg').textContent = 'Firebase isn’t connected. Fill in firebase-config.js.'; $('lmsg').className = 'msg err'; }
else PP.ready.then(u => {
  view(u && PP.adminEmail && u.email.toLowerCase() === PP.adminEmail ? u : null);
  // If this page's sign-in changes (signed out in another tab, or not the owner any more), go back to the sign-in screen
  PP.auth.onAuthStateChanged(n => {
    const owner = n && PP.adminEmail && (n.email || '').toLowerCase() === PP.adminEmail;
    if (me && !owner) { view(null); $('lmsg').textContent = 'You were signed out. Sign in again as the super admin.'; $('lmsg').className = 'msg err'; }
  });
});
$('lform').onsubmit = async e => {
  e.preventDefault(); $('lmsg').textContent = 'Signing in…'; $('lmsg').className = 'msg';
  try {
    const c = await PP.auth.signInWithEmailAndPassword($('lem').value.trim(), $('lpw').value);
    if (PP.adminEmail && c.user.email.toLowerCase() !== PP.adminEmail) { await PP.auth.signOut(); throw { code: 'not-owner' }; }
    view(c.user);
  } catch (err) { $('lmsg').textContent = err.code === 'not-owner' ? 'Only the owner account can open the super admin.' : 'Wrong email or password.'; $('lmsg').className = 'msg err'; }
};
$('signout').onclick = async () => { await PP.auth.signOut(); view(null); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
function showTab(k){
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === k));
  $('v-users').hidden = k !== 'users'; $('v-cats').hidden = k !== 'cats';
}

async function refresh(){
  try {
    const [us, ms] = await Promise.all([PP.db.collection('companies').get(), PP.db.collection('models').get()]);
    users = us.docs.map(d => ({ id: d.id, ...d.data() }));
    models = ms.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
    renderUsers(); renderCats();
  } catch (e) { toast(e.code === 'permission-denied' ? 'Refused: check the owner email in the rules.' : 'Couldn’t load data.'); }
}
const modelName = id => (models.find(m => m.id === id) || {}).name || id;

// ---------- companies ----------
const MAXL = 5;
const slug = n => (n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'company') + '-' + Math.random().toString(36).slice(2, 6);
const cRef = id => PP.db.collection('companies').doc(id);
const aRef = email => PP.db.collection('access').doc(email);
const members = c => Array.isArray(c.members) ? c.members : [];
function renderUsers(){
  const st = users.map(status), c = k => st.filter(s => s.k === k).length;
  const logins = users.reduce((a, u) => a + members(u).length, 0);
  const tiles = [['all', `Companies · ${logins} logins`, users.length, 'var(--blue)'], ['active', 'Active', c('active'), 'var(--ok)'], ['soon', `Ending in ${SOON} days`, c('soon'), 'var(--warn)'], ['expired', 'Expired / paused', c('expired') + c('paused') + c('none'), 'var(--bad)']];

async function saveCo(id, patch, okMsg){

}
$('ulist').onclick = async e => {

const genPw = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint32Array(10)); for (const x of r) s += a[x % a.length]; return s.slice(0, 4) + '-' + s.slice(4); };
function dialog(html){ $('layer').innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog">${html}</div></div>`; $('scrim').onclick = e => { if (e.target.id === 'scrim' || e.target.closest('[data-x]')) $('layer').innerHTML = ''; }; return $('layer').querySelector('form'); }
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

// Create a login (on a second connection so the super admin stays signed in) and link it to the company
async function addLogin(co, email, pw){
  email = email.trim().toLowerCase();
  if (!validEmail(email)) throw new Error('Type a full email address.');
  if (members(co).includes(email)) throw new Error('This email is already a login for this company.');
  if (members(co).length >= MAXL) throw new Error(`This company already has ${MAXL} logins. Remove one first.`);
  const other = users.find(x => x.id !== co.id && members(x).includes(email));
  if (other) throw new Error(`This email already belongs to ${other.name}.`);
  let note = 'Login created.', created = true;
  try {
    const sec = firebase.apps.find(a => a.name === 'create') || firebase.initializeApp(window.PP_FIREBASE, 'create');
    await sec.auth().createUserWithEmailAndPassword(email, pw); await sec.auth().signOut();
  } catch (err) {
    if (err.code === 'auth/email-already-in-use') { created = false; note = 'This email already had a login, so its existing password is unchanged.'; }
    else {
      // the login was NOT created: stop here and say exactly how to fix it
      const why = {
        'auth/admin-restricted-operation': 'Firebase has sign-up switched off. In Firebase → Authentication → Settings → User actions, tick "Enable create (sign-up)" and Save, then add this login again.',
        'auth/operation-not-allowed': 'Email/Password sign-in is off. In Firebase → Authentication → Sign-in method, enable Email/Password, then add this login again.',
        'auth/weak-password': 'The password is too weak. Use at least 6 characters.',
        'auth/invalid-email': 'That email address isn\u2019t valid.',
        'auth/network-request-failed': 'No connection. Check the internet and try again.',
        'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.'
      }[err.code] || ('Firebase refused to create the login (' + (err.code || err.message) + ').');
      throw new Error('The login was not created. ' + why);
    }
  }
  const list = [...members(co), email];
  const RULES = ' Firebase refused it: the Firestore rules published in Firebase are not the latest. Paste the latest rules (Firestore → Rules), Publish, wait a minute, then add this login again.';
  try { await aRef(email).set({ company: co.id, mustChange: created, added: firebase.firestore.FieldValue.serverTimestamp(), by: me.email }); }
  catch (err) { throw new Error(created ? `The login ${email} was created, but linking it to the company was refused (access/${email}, ${err.code || err.message}).` + RULES : `Linking ${email} was refused (access/${email}, ${err.code || err.message}).` + RULES); }
  try { await cRef(co.id).set({ members: list, updated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); }
  catch (err) { try { await aRef(email).delete(); } catch (e) {} throw new Error(`Adding ${email} to the company list was refused (companies/${co.id}, ${err.code || err.message}).` + RULES); }
  co.members = list;
  return { email, pw, created, note };
}
async function removeLogin(co, email){
  const list = members(co).filter(m => m !== email);
  await aRef(email).delete();
  try { await PP.db.collection('sessions').doc(email).delete(); } catch (e) {}
  await cRef(co.id).set({ members: list, updated: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  co.members = list;
}

// ---------- remove a company: confirm with the super admin password ----------
function confirmRemove(u){
  const ms = members(u);
  const f = dialog(`<h2>Remove ${esc(u.name)}?</h2><div class="sub">This can't be undone.</div>
    <form>
      <div class="warnbox"><b>What happens</b>
        <span>• The company and its subscription are deleted.</span>
        <span>• ${ms.length ? `Its ${ms.length === 1 ? 'login' : ms.length + ' logins'} (${ms.map(esc).join(', ')}) ${ms.length === 1 ? 'loses' : 'lose'} access straight away.` : 'It has no logins.'}</span>
        <span>• The logins stay in Firebase → Authentication. You can add them to another company, or delete them there.</span>
      </div>
      <div class="f"><label for="rmpw">Your super admin password</label><input id="rmpw" type="password" autocomplete="current-password" required placeholder="Password for ${esc(me.email)}"></div>
      <div class="msg" id="rmsg"></div>
      <div class="foot"><button type="button" class="btn" data-x>Cancel</button><button class="btn danger-solid" id="rmgo">Remove company</button></div>
    </form>`);
  setTimeout(() => $('rmpw').focus(), 50);
  const say = (t, c) => { $('rmsg').textContent = t; $('rmsg').className = 'msg ' + (c || ''); };
  f.onsubmit = async e => {
    e.preventDefault();
    const pw = $('rmpw').value; if (!pw) return say('Type your password.', 'err');
    $('rmgo').disabled = true; say('Checking password…');
    // 1) confirm it's really the super admin
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(PP.auth.currentUser.email, pw);
      await PP.auth.currentUser.reauthenticateWithCredential(cred);
    } catch (err) {
      $('rmgo').disabled = false;
      return say(['auth/wrong-password', 'auth/invalid-credential', 'auth/invalid-login-credentials'].includes(err.code) ? 'Wrong password.' : err.code === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes.' : 'Couldn’t check the password: ' + (err.code || err.message), 'err');
    }
    // 2) delete, step by step, so any refusal says exactly what was blocked
    say('Removing…');
    const failed = [];
    for (const m of ms) {
      try { await aRef(m).delete(); } catch (err) { failed.push(`login link ${m} (${err.code || err.message})`); }
      try { await PP.db.collection('sessions').doc(m).delete(); } catch (err) { /* device record is optional */ }
    }
    try { await cRef(u.id).delete(); } catch (err) { failed.push(`company record (${err.code || err.message})`); }
    await refresh();
    if (!failed.length) { $('layer').innerHTML = ''; toast(`${u.name} removed`); return; }
    $('rmgo').disabled = false;
    say('Firebase refused to delete: ' + failed.join('; ') + '. Your Firestore rules are probably an older version. Paste the latest rules (they contain "allow delete: if isOwner();" under companies and "allow write: if isOwner();" under access), Publish, wait a minute and try again.', 'err');
  };
}

  }
  if (b.dataset.a === 'del') {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; setTimeout(() => { if (b.isConnected) { b.dataset.sure = ''; b.textContent = 'Delete'; } }, 3000); return; }
    try { const figs = await model.collection('figures').get(); for (const d of figs.docs) await d.ref.delete(); await model.delete(); toast('Catalogue deleted'); refresh(); }
    catch (err) { toast('Couldn’t delete: ' + (err.message || err)); }
  }
};
const cmsg = (t, c) => { $('cmsg').textContent = t || ''; $('cmsg').className = 'msg ' + (c || ''); };
$('cfile').onchange = async () => {
  const f = $('cfile').files[0]; if (!f) return; $('cfname').textContent = f.name;
  try { data = JSON.parse(await f.text()); if (!data.model || !Array.isArray(data.figures) || !data.figures.length) throw 0; cmsg(`${data.name || data.model}: ${data.figures.length} figures ready.`); $('cgo').disabled = false; }
  catch (e) { data = null; $('cgo').disabled = true; cmsg('That isn’t a Parts Picker catalogue file.', 'err'); }
};
$('cgo').onclick = async () => {
  if (!data) return; $('cgo').disabled = true;
  const model = PP.db.collection('models').doc(data.model), col = model.collection('figures');
  try {
    const prev = await model.get(), visible = prev.exists ? prev.data().visible !== false : true;
    const keep = new Set(data.figures.map(f => 'fig' + String(f.n).padStart(2, '0')));
    for (const d of (await col.get()).docs) if (!keep.has(d.id)) await d.ref.delete();
    let done = 0;
    for (const f of data.figures) {
      await col.doc('fig' + String(f.n).padStart(2, '0')).set({ n: f.n, t: f.t, w: f.w, h: f.h, hs: f.hs, img: f.img, hot: JSON.stringify(f.hot), parts: JSON.stringify(f.parts) });
      done++; $('cprog').style.width = (done / data.figures.length * 100) + '%'; cmsg(`Uploading… ${done} / ${data.figures.length}`);
    }
    await model.set({ name: data.name || data.model, sub: data.sub || '', codes: data.codes || '', catalog: data.catalog || '', short: data.short || '',
      figures: data.figures.length, parts: data.figures.reduce((a, f) => a + f.parts.length, 0), visible, updated: firebase.firestore.FieldValue.serverTimestamp() });
    cmsg(`Done. ${data.name || data.model} is uploaded${visible ? ' and shown on the app' : ' (hidden)'}.`, 'ok'); refresh();
  } catch (err) { cmsg(err && err.code === 'permission-denied' ? 'Upload refused: only the owner can upload.' : 'Upload stopped: ' + (err.message || err), 'err'); }
  finally { $('cgo').disabled = false; }
};
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});</script>
